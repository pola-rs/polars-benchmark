acceptEula: true
license:
  onPremEnterprise:
    enabled: true
    secretName: license
    secretProperty: license.json
scheduler:
  deployment:
    affinity:
      podAffinity:
        requiredDuringSchedulingIgnoredDuringExecution:
          - labelSelector:
              matchLabels:
                polars-scheduling-target: "true"
            namespaces:
              - "kube-system"
            topologyKey: "kubernetes.io/hostname"
    runtimeContainer:
      resources:
        requests:
          memory: 12Gi
        limits:
          memory: 12Gi
worker:
  deployment:
    affinity:
      podAntiAffinity:
        preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            podAffinityTerm:
              labelSelector:
                matchLabels:
                  polars-scheduling-target: "true"
              topologyKey: "kubernetes.io/hostname"
    replicaCount: 32
    runtimeContainer:
      resources:
        requests:
          memory: 12Gi
        limits:
          memory: 12Gi
anonymousResults:
  s3:
    enabled: true
    endpoint: s3://polars-benchmark
runtime:
  composed:
    dist:
      repository: polarsinc/polars-nanook-compute
      tag: "0.10.1"
      pullPolicy: Always
